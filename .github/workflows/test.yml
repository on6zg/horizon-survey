name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step and no lockfile on purpose: package.json declares no
      # dependencies, it only marks the repo as ESM so node can import
      # geometry.js.
      #
      # The `ls` is not decoration. `node --test` exits 0 when it finds no
      # test files at all, so without it a branch that dropped the suite
      # would show a green check.
      - name: Unit tests
        run: |
          ls test/*.test.js
          node --test

      # Both Python steps run even when the Node step above failed. Without
      # that, a broken serve_https.py stays invisible in any run that also
      # has a failing test, and gets found only once the tests are green.
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: '3.11'

      - name: serve_https.py compiles
        if: ${{ !cancelled() }}
        run: python -m py_compile serve_https.py

  # The job above is the fresh-clone case: nothing installed, so the browser
  # tests skip themselves and `npm test` still means something. This one is
  # the same command with Playwright present, so both states stay honest.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: node --test
